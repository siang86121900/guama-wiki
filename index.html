<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#278AFC">
  <meta name="description" content="呱馬圖鑑：瀏覽寵物、魚、作物、料理、材料、怪物、裝備、職業分支與技能介紹。純遊戲資料，公開查詢。">
  <title>呱馬圖鑑</title>
  <script>
    (() => {
      let choice = 'system';
      try { const saved = localStorage.getItem('guama-wiki-theme'); if (['light','dark','system'].includes(saved)) choice = saved; } catch (_) {}
      document.documentElement.dataset.theme = choice === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : choice;
      window.WIKI_THEME = choice;
    })();
  </script>
  <link rel="stylesheet" href="./styles.css">
  <script defer src="./data.js"></script>
  <script defer src="./catalog.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <a class="skip" href="#main">跳到主要內容</a>
  <div class="shell">
    <header class="topbar"><a class="brand" href="#/" aria-label="呱馬圖鑑首頁"><span class="brand-icon" aria-hidden="true">✦</span>呱馬圖鑑</a><label class="theme-control">外觀<select id="theme" aria-label="切換亮色、暗色或跟隨系統"><option value="system">跟系統</option><option value="light">亮色</option><option value="dark">暗色</option></select></label></header>
    <main id="main" tabindex="-1"></main>
    <footer>呱馬圖鑑 <span aria-hidden="true">·</span> 公開遊戲資料<br><span>1,015 張寵物圖片已齊全；2,188 張裝備圖片已齊全</span></footer>
  </div>
  <noscript><p>請開啟 JavaScript，以瀏覽圖鑑與使用搜尋。</p></noscript>
</body>
</html>
